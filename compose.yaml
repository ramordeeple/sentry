services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cbr_mock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cbr_mock"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-18-data:/var/lib/postgresql

volumes:
  postgres-18-data:
